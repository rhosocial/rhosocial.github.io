# Deploys the entire site to GitHub Pages.
# Builds any SSG apps under src/products/ before deploying.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build product SSG apps under src/products/
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Astro SSG — rhosocial-activerecord
        run: |
          cd src/products/rhosocial-activerecord
          npm ci
          npm run build
          cp -r dist/* ../../../src/products/rhosocial-activerecord/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4